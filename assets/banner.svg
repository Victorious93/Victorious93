<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">VICTORIOUS93 — Victorious Framework</title>
  <desc id="d">Dark navy neon banner with a terminal prompt motif and the text VICTORIOUS93.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1230"/>
      <stop offset="1" stop-color="#050816"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F0FF"/>
      <stop offset="0.55" stop-color="#4FA8FF"/>
      <stop offset="1" stop-color="#FF2E97"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#00F0FF"/>
      <stop offset="0.8" stop-color="#FF2E97"/>
      <stop offset="1" stop-color="#FF2E97" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1B2A5C" stroke-width="1" opacity="0.55"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="298" fill="none" stroke="#00F0FF" stroke-opacity="0.35" stroke-width="2" rx="14"/>

  <!-- terminal window chrome -->
  <g transform="translate(70 70)">
    <rect width="230" height="160" rx="14" fill="#070C22" stroke="#00F0FF" stroke-width="2.5" filter="url(#softglow)"/>
    <circle cx="22" cy="20" r="5" fill="#FF2E97"/>
    <circle cx="40" cy="20" r="5" fill="#FFB000"/>
    <circle cx="58" cy="20" r="5" fill="#00F0FF"/>
    <line x1="0" y1="38" x2="230" y2="38" stroke="#00F0FF" stroke-opacity="0.4"/>
    <text x="38" y="125" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="78" font-weight="700" fill="#00F0FF" filter="url(#glow)">&gt;</text>
    <rect x="110" y="110" width="62" height="12" fill="#FF2E97" filter="url(#glow)">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- wordmark -->
  <text x="345" y="150" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="74" font-weight="700" letter-spacing="4" fill="#FF2E97" opacity="0.55" transform="translate(3 3)">VICTORIOUS93</text>
  <text x="345" y="150" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="74" font-weight="700" letter-spacing="4" fill="url(#neon)" filter="url(#glow)">VICTORIOUS93</text>

  <rect x="345" y="172" width="790" height="3" fill="url(#rule)" filter="url(#softglow)"/>

  <text x="347" y="210" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="22" letter-spacing="9" fill="#FF2E97" filter="url(#softglow)">VICTORIOUS FRAMEWORK</text>
  <text x="347" y="246" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="17" fill="#9FB4E8">Android tooling · rooting &amp; flashing · AI agents · Linux installers</text>
</svg>
